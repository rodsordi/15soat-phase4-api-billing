openapi: 3.0.3
info:
  title: API de Faturamento e Pagamentos
  description: |
    Microsserviço responsável por faturas, orçamentos e integração com Mercado Pago para oficina mecânica.

    ### 📐 Padrões Arquiteturais e Conformidade Técnica (RFCs & ADRs)
    - **Navegação Hipermídia (HATEOAS / Richardson Maturity Model Nível 3)**:
      - Implementado via padrão HAL (*Hypertext Application Language* - `draft-kelly-json-hal-08` / **RFC 8288**).
      - Respostas expõem o nó `_links` contendo navegação do recurso (`self`) e correlação com a Ordem de Serviço de origem (`workOrder`).
      - Suporte a templates de URI parametrizados conforme **RFC 6570** (`templated: boolean`).
      - Identificadores e referências canônicas estruturadas de acordo com **RFC 3986**.
    - **Tratamento Padronizado de Erros (RFC 7807 / RFC 9457)**:
      - Respostas de falha estruturadas no padrão canônico *Problem Details for HTTP APIs* (`application/problem+json`).
    - **Granularidade e Simetria de DTOs (ADR-0003)**:
      - `InvoiceDetailedResponse`: Detalhes completos da fatura de cobrança com metadados de pagamento externo e concorrência otimista.
  version: 1.0.0
servers:
  - url: /
    description: Servidor Atual
tags:
  - name: Billing
    description: Operações de faturamento, orçamentos e pagamentos
  - name: PaymentWebhook
    description: Notificações de webhook de pagamentos do Mercado Pago

paths:
  /api/v1/invoices:
    post:
      tags:
        - Billing
      summary: Criar fatura para uma Ordem de Serviço aprovada
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Fatura criada com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/invoices/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/invoices/{id}:
    get:
      tags:
        - Billing
      summary: Consultar fatura por ID
      operationId: getInvoiceById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único da fatura
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da fatura encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invoices/work-order/{workOrderId}:
    get:
      tags:
        - Billing
      summary: Consultar fatura por ID da Ordem de Serviço
      operationId: getInvoiceByWorkOrderId
      parameters:
        - name: workOrderId
          in: path
          required: true
          description: Identificador único da Ordem de Serviço vinculada
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da fatura encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/mercadopago/checkout:
    post:
      tags:
        - Billing
      summary: Gerar checkout com QR Code PIX do Mercado Pago
      operationId: createMercadoPagoCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout gerado com sucesso com QR Code PIX
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/mercadopago/webhook:
    post:
      tags:
        - PaymentWebhook
      summary: Endpoint idempotente de webhook para notificações de pagamento do Mercado Pago
      operationId: processPaymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MercadoPagoWebhookRequest'
      responses:
        '200':
          description: Notificação de webhook recebida e processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'

components:
  schemas:
    CreateInvoiceRequest:
      type: object
      description: Requisição para abertura de fatura vinculada à Ordem de Serviço
      required:
        - workOrderId
        - customerDocument
        - amount
      properties:
        workOrderId:
          type: string
          format: uuid
          description: Identificador da Ordem de Serviço
        customerDocument:
          type: string
          example: '52998224725'
          description: CPF ou CNPJ do cliente
        amount:
          type: number
          format: double
          example: 450.00
          description: Valor total faturado

    CheckoutRequest:
      type: object
      description: Requisição de inicialização de checkout de pagamento
      required:
        - invoiceId
      properties:
        invoiceId:
          type: string
          format: uuid
          description: Identificador da fatura

    CheckoutResponse:
      type: object
      description: Dados do checkout gerado com QR Code PIX
      properties:
        invoiceId:
          type: string
          format: uuid
          description: Identificador da fatura
        paymentId:
          type: string
          description: Identificador do pagamento gerado no gateway
        qrCode:
          type: string
          description: Código 'Copia e Cola' do PIX
        qrCodeBase64:
          type: string
          description: Imagem do QR Code em formato Base64
        status:
          type: string
          description: Status atual da tentativa de checkout

    MercadoPagoWebhookRequest:
      type: object
      description: Payload da notificação recebida do Mercado Pago
      required:
        - action
      properties:
        action:
          type: string
          example: 'payment.created'
          description: Ação do evento disparado
        data:
          type: object
          properties:
            id:
              type: string
              example: '123456789'
              description: Identificador do recurso no Mercado Pago

    WebhookResponse:
      type: object
      description: Resposta de confirmação de processamento do webhook
      properties:
        status:
          type: string
          example: 'PROCESSED'
          description: Status de processamento do webhook
        message:
          type: string
          description: Mensagem de confirmação ou detalhamento

    # =========================================================================
    # Invoice Schemas (ADR-0003: DTO Granularity & Symmetry)
    # Padrões aplicados:
    # - InvoiceDetailedResponse: Detalhes completos com auditoria e _links
    # =========================================================================
    InvoiceDetailedResponse:
      type: object
      description: Detalhes completos da fatura de cobrança (inclui metadados de pagamento e OS)
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da fatura
        workOrderId:
          type: string
          format: uuid
          description: Identificador da Ordem de Serviço
        customerDocument:
          type: string
          description: CPF ou CNPJ do cliente
        amount:
          type: number
          format: double
          description: Valor faturado
        status:
          type: string
          description: Status da fatura (PENDING, PAID, REJECTED, CANCELED)
        externalPaymentId:
          type: string
          description: Identificador do pagamento externo no gateway
        createdAt:
          type: string
          format: date-time
          description: Data e hora de emissão da fatura
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização
        version:
          type: integer
          format: int64
          description: Versão de controle de concorrência otimista
        _links:
          type: object
          description: Links hipermídia para navegação conforme padrão HAL / Spring HATEOAS
          properties:
            self:
              $ref: '#/components/schemas/Link'
            workOrder:
              $ref: '#/components/schemas/Link'

    # =========================================================================
    # Hypermedia Link Schema (RFC 8288 / HAL Specification)
    # Padrão: Richardson Maturity Model Level 3 & RFC 6570 (URI Template)
    # Decisão de Design: O atributo 'example' adota URI canônica neutra
    # (/api/v1/resources/{id}) para evitar acoplamento a domínios específicos
    # em schemas genéricos e reutilizáveis entre múltiplos recursos.
    # =========================================================================
    Link:
      type: object
      description: Link hipermídia conforme especificação HAL / RFC 8288
      required:
        - href
      properties:
        href:
          type: string
          example: '/api/v1/resources/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          description: URI de destino do recurso ou ação hipermídia
        templated:
          type: boolean
          example: false
          description: Indica se a URI é um URI Template (RFC 6570)

    # =========================================================================
    # Error Handling Schema (RFC 7807 / RFC 9457: Problem Details for HTTP APIs)
    # Padrão canônico de respostas de erro para APIs HTTP/REST.
    # Provê semântica unificada de falhas operacionais e de regras de negócio.
    # Content-Type correspondente: application/problem+json
    # =========================================================================
    ProblemDetail:
      type: object
      description: Estrutura padrão de erro conforme especificações RFC 7807 e RFC 9457
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica o tipo do problema
        title:
          type: string
          description: Resumo curto e legível do problema
        status:
          type: integer
          description: Código de status HTTP
        detail:
          type: string
          description: Explicação legível e específica para esta ocorrência
        errorCode:
          type: string
          description: Código de erro de negócio padronizado
        timestamp:
          type: string
          format: date-time
          description: Data e hora da ocorrência
        traceId:
          type: string
          description: Identificador de rastreamento distribuído

  responses:
    BadRequest:
      description: Requisição Inválida (Bad Request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Recurso Não Encontrado (Not Found)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Erro de Validação ou Regra de Domínio (Unprocessable Entity)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
